name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-notarize-release:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_SETTINGS="$(xcodebuild \
            -project Jostle.xcodeproj \
            -target Jostle \
            -configuration Release \
            -showBuildSettings 2>/dev/null)"
          VERSION="$(awk -F ' = ' '/ MARKETING_VERSION = / { print $2; exit }' <<< "$BUILD_SETTINGS")"
          BUILD_NUMBER="$(awk -F ' = ' '/ CURRENT_PROJECT_VERSION = / { print $2; exit }' <<< "$BUILD_SETTINGS")"

          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match MARKETING_VERSION '$VERSION'." >&2
            exit 1
          fi
          if grep -Fq "## $VERSION — Unreleased" CHANGELOG.md; then
            echo "CHANGELOG.md still marks $VERSION as unreleased." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=dist/$VERSION" >> "$GITHUB_ENV"

      - name: Validate release secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            SPARKLE_ED_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required repository secret '$name' is not configured." >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/jostle-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Configure Apple notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials JostleNotary \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id 7KGB78B22T \
            --keychain "$KEYCHAIN_PATH" \
            --validate

      - name: Build, sign, notarize, and generate appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        shell: bash
        run: Scripts/release.sh

      - name: Retain release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Jostle-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}
          path: ${{ env.ARTIFACT_DIR }}/*
          if-no-files-found: error
          retention-days: 90

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          awk -v version="$VERSION" '
            $0 ~ "^## " version " " { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$NOTES"
          if [[ ! -s "$NOTES" ]]; then
            echo "No release notes found for $VERSION in CHANGELOG.md." >&2
            exit 1
          fi
          echo "RELEASE_NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=(
            "$ARTIFACT_DIR/Jostle-$VERSION.dmg"
            "$ARTIFACT_DIR/Jostle-$VERSION.zip"
            "$ARTIFACT_DIR/Jostle-$VERSION-dSYMs.zip"
            "$ARTIFACT_DIR/Jostle-$VERSION-SHA256SUMS.txt"
            "$ARTIFACT_DIR/appcast.xml"
          )

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Jostle $VERSION" \
              --notes-file "$RELEASE_NOTES"
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --verify-tag \
              --title "Jostle $VERSION" \
              --notes-file "$RELEASE_NOTES"
          fi

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
